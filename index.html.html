.lead{text-align:center;color:var(--muted);margin:6px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.svc{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:2px solid transparent;border-radius:26px 8px 26px 8px;box-shadow:0 6px 20px rgba(107,24,48,.08);cursor:pointer;transition:border-color .2s,background .2s}

.ic{flex:none;width:54px;height:54px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-size:26px}
.svc b{display:block;font-size:18px}
.svc small{color:var(--muted)}
.svc.on{border-color:var(--gold);background:var(--blush)}
.svc::after{content:"";position:absolute;top:10px;left:12px;width:26px;height:26px;border-radius:50%;border:2px solid var(--rose);background:var(--card);text-align:center}
.svc.on::after{content:"✓";background:var(--wine);border-color:var(--wine);color:#fff;font-weight:700;font-size:16px;line-height:22px}
.offer{background:var(--wine);color:#FFF4EF;border-radius:36px;padding:34px 22px;text-align:center;margin-top:30px;position:relative;box-shadow:0 14px 40px rgba(107,24,48,.3)}
.offer .top{font-family:"Reem Kufi",sans-serif;font-size:22px;color:var(--rose)}
.price{font-family:"Reem Kufi",sans-serif;font-size:clamp(80px,22vw,128px);font-weight:700;line-height:1.05;color:var(--gold)}
.price span{font-size:.28em;margin-inline-start:8px;color:#FFF4EF}
.ship{display:inline-block;margin-top:8px;padding:6px 24px;background:var(--gold);color:#3A1220;border-radius:30px;font-weight:700}
#status{margin:18px 0 0;font-weight:500;min-height:1.7em}
#book{margin-top:12px}
#book[aria-disabled="true"]{opacity:.55;pointer-events:none}
.contact{text-align:center}
.wa-box{display:inline-flex;align-items:center;gap:16px;padding:12px 30px 12px 20px;background:var(--wine);color:#FFF4EF;text-decoration:none;border-radius:60px;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(201,162,75,.2),0 12px 30px rgba(107,24,48,.3)}
.wa-box:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.wa-ic{flex:none;width:58px;height:58px}
.wa-txt{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.wa-txt small{font-size:17px;color:var(--rose)}
.wa-num{direction:ltr;font-family:"Reem Kufi",sans-serif;font-size:clamp(26px,8vw,36px);font-weight:700;letter-spacing:1px}
:root[data-theme="dark"] .num{color:var(--rose)}

.contact{position:relative;overflow:hidden;padding:64px 0 76px}
.contact .wrap{position:relative;z-index:1}
footer{text-align:center;color:var(--muted);padding:26px 0 40px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
